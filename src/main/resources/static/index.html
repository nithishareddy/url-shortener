<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>URL Shortener</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
      }
      h1 {
        font-size: 1.4rem;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      input,
      button {
        padding: 0.5rem;
        font-size: 1rem;
      }
      button {
        cursor: pointer;
      }
      #result {
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 1rem;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        display: none;
      }
      a.doc-link {
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>URL Shortener</h1>
    <p class="doc-link">
      Full API docs: <a href="/swagger-ui.html">/swagger-ui.html</a>
    </p>
    <form id="create-form">
      <input id="longUrl" type="url" placeholder="https://example.com/some/long/path" required />
      <input id="customAlias" type="text" placeholder="Custom alias (optional)" pattern="[A-Za-z0-9_-]{3,20}" />
      <button type="submit">Shorten</button>
    </form>
    <div id="result"></div>

    <script>
      const form = document.getElementById('create-form');
      const result = document.getElementById('result');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const longUrl = document.getElementById('longUrl').value;
        const customAlias = document.getElementById('customAlias').value || null;

        const response = await fetch('/api/urls', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ longUrl, customAlias }),
        });
        const body = await response.json();
        result.style.display = 'block';

        if (!response.ok) {
          result.textContent = 'Error ' + response.status + ': ' + (body.detail || 'request failed');
          return;
        }

        result.innerHTML =
          'Short URL: <a href="' + body.shortUrl + '" target="_blank">' + body.shortUrl + '</a>\n' +
          'Analytics: <a href="/api/urls/' + body.shortCode + '/analytics" target="_blank">' +
          '/api/urls/' + body.shortCode + '/analytics</a>\n\n' +
          JSON.stringify(body, null, 2);
      });
    </script>
  </body>
</html>
