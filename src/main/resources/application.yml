spring:
  application:
    name: url-shortener
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  base-url: http://localhost:8080
  rate-limit:
    create:
      capacity: 20
      refill-tokens: 20
      refill-duration-seconds: 60
  reserved-aliases: api,health,actuator,swagger-ui,v3,static,favicon.ico

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/urlshortener;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/urlshortener
    driver-class-name: org.postgresql.Driver
    username: urlshortener
    password: urlshortener
